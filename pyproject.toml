[project]
name = "jarvis"
version = "0.1.0"
description = "Fully local, voice-first AI assistant for Windows that monitors the machine and answers spoken questions about it."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }

# Core dependencies. These are pure-Python / cross-platform and are what the
# test suite and the quality gate run against. Heavy runtime engines (STT, TTS,
# wake word) and Windows-only bindings live in the extras below so that CI and
# development can run the full gate without a GPU or a Windows host.
dependencies = [
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "pyyaml>=6.0,<7",
    "psutil>=6.0",
    "numpy>=1.26,<3",
    "websockets>=13.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Continuous capture and playback plus wake-word detection.
# openWakeWord pulls tflite-runtime on Linux, which publishes no cp312 wheels.
# The target host is Windows (§0.4), so it is marked accordingly and the
# universal lock stays resolvable on a Linux development host.
audio = [
    "sounddevice>=0.4.7",
    "onnxruntime>=1.18",
    "openwakeword>=0.6.0; sys_platform == 'win32'",
]
# Speech to text. faster-whisper on GPU tiers, whisper.cpp on the cpu tier.
# pywhispercpp builds from source outside Windows wheels, so it is pinned to the
# target platform as well.
stt = [
    "faster-whisper>=1.0.3",
    "pywhispercpp>=1.2.0; sys_platform == 'win32'",
]
# Text to speech.
tts = [
    "kokoro>=0.9.2",
    "soundfile>=0.12.1",
]
# NVIDIA telemetry. Works on any platform with an NVIDIA driver present.
gpu = [
    "pynvml>=11.5.0",
]
# Windows-native bindings. Not installable on Linux or macOS.
windows = [
    "pywin32>=306; sys_platform == 'win32'",
    "wmi>=1.5.1; sys_platform == 'win32'",
    "pythonnet>=3.0.3; sys_platform == 'win32'",
    "pywinauto>=0.6.8; sys_platform == 'win32'",
    "pygetwindow>=0.0.9; sys_platform == 'win32'",
    "windows-toasts>=1.1.0; sys_platform == 'win32'",
]
# Screen capture for the vision tool.
vision = [
    "mss>=9.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
    "types-psutil>=6.0",
]

[project.scripts]
jarvis = "jarvis.main:main"
jarvis-helper = "jarvis.helper.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.hatch.build.targets.wheel.force-include]
"src/jarvis/py.typed" = "jarvis/py.typed"

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]
exclude = ["src/jarvis/ui/app", "models", "vendor", ".venv"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "C4",   # comprehensions
    "UP",   # pyupgrade
    "SIM",  # simplify
    "RUF",  # ruff-specific
    "ANN",  # type annotations
    "ASYNC",
    "S",    # bandit
    "PTH",  # prefer pathlib
    "RET",
    "TID",
    "BLE",  # blind except must be justified with a noqa
    "PLE",
    "PLW",
    "T20",  # no stray print() in library code
]
ignore = [
    "ANN401",  # allow typing.Any where a boundary genuinely needs it
    "S101",    # assert is fine in tests
    "RUF012",  # ClassVar annotation not required for pydantic model fields
]

[tool.ruff.lint.per-file-ignores]
# S604: ruff reads our shell={...} config kwarg as subprocess shell=True.
"tests/**" = ["S101", "S105", "S106", "S108", "ANN", "S603", "S604", "S607"]
"scripts/**" = ["S603", "S607", "T201"]
"src/jarvis/tools/shell.py" = ["S603"]  # subprocess use is the point, and is hardened

[tool.ruff.lint.isort]
known-first-party = ["jarvis"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_reexport = true
show_error_codes = true
exclude = ["src/jarvis/ui/app/.*"]

# Third-party engines that are either optional extras or Windows-only have no
# type stubs available in the dev environment. Their call sites are wrapped and
# validated at runtime instead.
[[tool.mypy.overrides]]
module = [
    "sounddevice.*",
    "openwakeword.*",
    "onnxruntime.*",
    "faster_whisper.*",
    "pywhispercpp.*",
    "kokoro.*",
    "soundfile.*",
    "pynvml.*",
    "win32api",
    "win32con",
    "win32com.*",
    "win32event",
    "win32evtlog",
    "win32file",
    "win32gui",
    "win32pipe",
    "win32process",
    "win32security",
    "pythoncom",
    "pywintypes",
    "winerror",
    "wmi.*",
    "clr.*",
    "System.*",
    "pywinauto.*",
    "pygetwindow.*",
    "windows_toasts.*",
    "mss.*",
    "torch.*",
    "silero_vad.*",
    "PIL.*",
    "ctranslate2.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "manual: requires a human, a microphone, a GPU, or a Windows host",
    "integration: exercises more than one subsystem together",
    "slow: takes more than a second",
]
filterwarnings = ["ignore::DeprecationWarning"]

# Fork the universal lock per platform. Without this uv resolves one graph for
# all platforms at once, and openWakeWord's Linux-only tflite-runtime dependency
# makes that graph unsatisfiable on Python 3.12 even though it is never
# installed on the Windows target.
[tool.uv]
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'linux'",
    "sys_platform == 'darwin'",
]
